<svg width="520" height="520" viewBox="0 0 520 520"
     xmlns="http://www.w3.org/2000/svg">

    <defs>
        <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#dbeafe"/>
        </linearGradient>

        <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#2563eb"/>
            <stop offset="100%" stop-color="#60a5fa"/>
        </linearGradient>

        <filter id="shadow">
            <feDropShadow
                dx="0"
                dy="18"
                stdDeviation="15"
                flood-opacity="0.25"/>
        </filter>
    </defs>

    <!-- Glow -->
    <circle
        cx="260"
        cy="260"
        r="190"
        fill="#ffffff"
        opacity="0.08"/>

    <!-- Antenna -->
    <line
        x1="260"
        y1="82"
        x2="260"
        y2="48"
        stroke="#ffffff"
        stroke-width="10"
        stroke-linecap="round"/>

    <circle
        cx="260"
        cy="38"
        r="14"
        fill="#ffd43b"/>

    <!-- Robot Head -->
    <rect
        x="115"
        y="95"
        width="290"
        height="220"
        rx="55"
        fill="url(#body)"
        filter="url(#shadow)"/>

    <!-- Ear Left -->
    <rect
        x="88"
        y="155"
        width="28"
        height="90"
        rx="14"
        fill="#bfdbfe"/>

    <!-- Ear Right -->
    <rect
        x="404"
        y="155"
        width="28"
        height="90"
        rx="14"
        fill="#bfdbfe"/>

    <!-- Face Screen -->
    <rect
        x="150"
        y="130"
        width="220"
        height="145"
        rx="35"
        fill="url(#screen)"/>

    <!-- Eyes -->
    <circle
        cx="205"
        cy="190"
        r="20"
        fill="#ffffff"/>

    <circle
        cx="315"
        cy="190"
        r="20"
        fill="#ffffff"/>

    <circle
        cx="205"
        cy="190"
        r="8"
        fill="#2563eb"/>

    <circle
        cx="315"
        cy="190"
        r="8"
        fill="#2563eb"/>

    <!-- Smile -->
    <path
        d="M205 225 Q260 260 315 225"
        fill="none"
        stroke="#ffffff"
        stroke-width="9"
        stroke-linecap="round"/>

    <!-- Body -->
    <rect
        x="145"
        y="330"
        width="230"
        height="115"
        rx="35"
        fill="url(#body)"
        filter="url(#shadow)"/>

    <!-- Body Screen -->
    <rect
        x="190"
        y="355"
        width="140"
        height="55"
        rx="18"
        fill="#dbeafe"/>

    <circle
        cx="220"
        cy="382"
        r="10"
        fill="#22c55e"/>

    <rect
        x="245"
        y="374"
        width="55"
        height="12"
        rx="6"
        fill="#2563eb"/>

    <!-- Left Arm -->
    <rect
        x="105"
        y="340"
        width="38"
        height="100"
        rx="19"
        fill="#ffffff"/>

    <!-- Right Arm -->
    <rect
        x="377"
        y="340"
        width="38"
        height="100"
        rx="19"
        fill="#ffffff"/>

    <!-- Hands -->
    <circle
        cx="124"
        cy="450"
        r="23"
        fill="#dbeafe"/>

    <circle
        cx="396"
        cy="450"
        r="23"
        fill="#dbeafe"/>

</svg>